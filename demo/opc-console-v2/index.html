<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>无极 · 业务流程看板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-tool" viewBox="0 0 16 16"><path d="M10.6 2.4a3 3 0 0 0-3.7 3.9L2.6 10.6a1.3 1.3 0 0 0 1.8 1.8l4.3-4.3a3 3 0 0 0 3.9-3.7L10.8 6.2 9.4 6.6 9.8 5.2Z"/></symbol>
    <symbol id="i-ext" viewBox="0 0 16 16"><path d="M4.5 2h7M4.5 14h7M5.5 2c0 4 5 4 5 6s-5 2-5 6M10.5 2c0 4-5 4-5 6s5 2 5 6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 16 16"><rect x="3.5" y="7" width="9" height="7"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></symbol>
    <symbol id="i-pause" viewBox="0 0 16 16"><path d="M5.5 3.5v9M10.5 3.5v9"/></symbol>
    <symbol id="i-play" viewBox="0 0 16 16"><path d="M5 3.2 12.5 8 5 12.8Z"/></symbol>
    <symbol id="i-rewind" viewBox="0 0 16 16"><path d="M3.2 8a4.8 4.8 0 1 0 1.4-3.4"/><path d="M3 2.4v2.8h2.8"/></symbol>
    <symbol id="i-stop" viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8"/></symbol>
    <symbol id="i-close" viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></symbol>
    <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
    <symbol id="i-up" viewBox="0 0 16 16"><path d="M8 13V3.5M4 7.5l4-4 4 4"/></symbol>
    <symbol id="i-down" viewBox="0 0 16 16"><path d="M8 3v9.5M4 8.5l4 4 4-4"/></symbol>
    <symbol id="i-flat" viewBox="0 0 16 16"><path d="M3 8h10"/></symbol>
    <symbol id="i-back" viewBox="0 0 16 16"><path d="M13 8H3.5M7.5 4l-4 4 4 4"/></symbol>
    <symbol id="i-check" viewBox="0 0 16 16"><path d="m3 8.5 3 3 7-7"/></symbol>
    <symbol id="i-feed" viewBox="0 0 16 16"><path d="M2.5 8h9M8.5 4.5 12 8l-3.5 3.5"/><path d="M14 3v10"/></symbol>
    <symbol id="i-share" viewBox="0 0 16 16"><circle cx="4" cy="8" r="2"/><circle cx="12" cy="4" r="2"/><circle cx="12" cy="12" r="2"/><path d="m5.8 7.1 4.4-2.2M5.8 8.9l4.4 2.2"/></symbol>
    <symbol id="i-send" viewBox="0 0 16 16"><path d="M2.5 8 13.5 3l-4 11-2-4.5Z"/><path d="m7.5 9.5 6-6.5"/></symbol>
  </svg>

  <header class="gantry">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 22 44" aria-hidden="true">
        <rect x="3" y="1" width="16" height="9" fill="#ff4a35"/>
        <rect x="3" y="11" width="16" height="9" fill="#ffc21a"/>
        <rect x="3" y="21" width="16" height="9" fill="#3ad16f"/>
        <rect x="9" y="31" width="4" height="9" fill="#3a3a36"/>
        <rect x="4" y="40" width="14" height="3" fill="#3a3a36"/>
      </svg>
      <div>
        <div class="brand-name">无极</div>
        <div class="brand-crew" id="brand-crew"></div>
      </div>
    </div>

    <div class="meters">
      <div class="meter">
        <span class="meter-label">本周收入</span>
        <span class="meter-val"><span class="meter-unit">¥</span><span class="seg lg" id="m-rev"></span></span>
      </div>
      <div class="meter optional">
        <span class="meter-label">净额</span>
        <span class="meter-val"><span class="meter-unit">¥</span><span class="seg md green" id="m-net"></span></span>
      </div>
      <div class="meter">
        <span class="meter-label">占用我</span>
        <span class="meter-val"><span class="seg md" id="m-min"></span><span class="meter-unit">分钟</span></span>
      </div>
      <div class="meter optional">
        <span class="meter-label">判断命中</span>
        <span class="meter-small" id="m-hit"></span>
      </div>
    </div>

    <div class="gantry-actions">
      <div class="toggle" role="group" aria-label="视图">
        <button data-view="chain" aria-pressed="true">流程</button>
        <button data-view="align" aria-pressed="false">环节对齐</button>
        <button data-view="crew" aria-pressed="false">Agent</button>
      </div>
      <button class="btn" id="idea-btn" aria-expanded="false"><svg class="i"><use href="#i-plus"/></svg><span class="btn-idea-label">新想法</span></button>
      <button class="call-btn" id="call-btn" aria-label="打开收件箱"><i class="beacon"></i><span>待处理</span><span class="call-count" id="call-count">0</span></button>
    </div>
  </header>

  <div class="strip" id="strip"></div>

  <main class="floor" id="floor"></main>
  <section class="bench" id="bench" aria-label="想法孵化"></section>

  <section class="bay" id="bay" aria-label="业务详情"></section>
  <section class="bay sheet" id="sheet" aria-label="流程方案"></section>

  <div class="scrim" id="scrim"></div>

  <aside class="desk" id="desk" aria-label="收件箱">
    <div class="desk-head">
      <div>
        <h2 class="desk-title">收件箱</h2>
        <p class="desk-sub" id="desk-sub"></p>
      </div>
      <button class="icon-btn" id="desk-close" aria-label="关闭收件箱"><svg class="i"><use href="#i-close"/></svg></button>
    </div>
    <div class="desk-body" id="desk-body"></div>
  </aside>

  <form class="idea" id="idea" autocomplete="off">
    <div class="idea-h"><span class="mk lg mk-fs">Fs</span><div><h3>交给 Flowsmith 评估</h3><p>它会调研、查失败库、比对能复用的步骤，再提交一份流程方案给你批准。</p></div></div>
    <div class="form" style="border-top:0;padding-top:0;margin-top:12px">
      <label class="field"><span>想法</span><input name="name" placeholder="例：把播客做成付费精华版" required /></label>
      <label class="field"><span>假设：你相信什么会成立</span><textarea name="hyp" placeholder="例：老听众愿意为去水的精华版付费"></textarea></label>
      <label class="field"><span>分类</span><select name="v" id="idea-v"></select></label>
      <p class="form-hint" id="idea-hint">判据在批准方案时由你锁定。写不出判据，方案不能上线。</p>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button type="button" class="btn ghost" id="idea-cancel">取消</button>
        <button type="submit" class="btn solid" id="idea-submit" disabled><svg class="i"><use href="#i-send"/></svg>提交</button>
      </div>
    </div>
  </form>

  <div class="toast" id="toast" role="status" aria-live="polite"><i class="lamp"></i><span id="toast-text"></span></div>

  <script>
    window.addEventListener("error", function (e) {
      var b = document.getElementById("boot-err");
      if (!b) { b = document.createElement("div"); b.id = "boot-err"; b.setAttribute("role", "alert"); document.body.prepend(b); }
      b.textContent = "页面脚本出错：" + (e.message || e.type) + (e.filename ? "（" + e.filename.split("/").pop() + ":" + e.lineno + "）" : "");
    }, true);
  </script>
  <script src="data.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
